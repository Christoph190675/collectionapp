# Continuous integration (specs/003-continuous-integration)
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only, no secret (FR-007)
permissions:
  contents: read

# A new commit on the same branch cancels the run in progress (FR-006)
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CollectionApp.slnx

      - name: Build
        run: dotnet build CollectionApp.slnx -c Release --no-restore

      # Integration tests start their own MySQL container (Testcontainers, Docker of the runner)
      - name: Test
        run: dotnet test CollectionApp.slnx -c Release --no-build --logger trx --results-directory TestResults

      # FR-003: a model change without its migration fails the build (constitution V)
      - name: Check pending model changes
        env:
          # Design-time host only: no connection is opened, these are not secrets
          ConnectionStrings__CollectionApp: Server=localhost;Database=design_time;User=ci;Password=ci
          Jwt__SigningKey: design-time-key-not-a-secret-0123456789abcdef
        run: |
          dotnet tool restore --tool-manifest dotnet-tools.json
          dotnet ef migrations has-pending-model-changes -p src/CollectionApp.Infrastructure -s src/CollectionApp.Api --configuration Release --no-build

      # FR-008: detailed results, even when the tests fail
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: backend/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Front (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npx ng lint

      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build
